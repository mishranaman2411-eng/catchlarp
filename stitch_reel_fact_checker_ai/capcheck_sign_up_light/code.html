<!-- Field: Full Name -->
<div class="flex flex-col gap-1.5">

<div class="w-5 h-5 rounded-full bg-surface-container-lowest shadow-[2px_2px_6px_rgba(0,0,0,0.06),-2px_-2px_4px_rgba(255,255,255,0.9)] flex items-center justify-center ml-2">
<span class="material-symbols-outlined text-[14px] text-on-surface" style="font-variation-settings: &quot;FILL&quot; 1;">check</span>

<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none" id="workemail" placeholder="name@domain.org" type="email" value="alex.vance@studio.org">
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center ml-2 shadow-sm">
<span class="material-symbols-outlined text-[13px] text-on-primary" style="font-variation-settings: &quot;FILL&quot; 1;">verified</span>

<button aria-label="Toggle password visibility" class="w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-all focus:outline-none" id="togglePassword" type="button">

</button>

<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div>

      </span>
</label>
</div>
<!-- Primary Obsidian CTA Button -->
<button class="w-full py-4 px-space-lg rounded-full bg-primary text-on-primary font-headline-sm text-headline-sm tracking-wide shadow-[0_16px_32px_-8px_rgba(0,0,0,0.35),0_4px_12px_rgba(0,0,0,0.15)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2 mb-space-lg" type="button">
<span>Agree &amp; Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Live Accuracy Index Neumorphic Pill Card -->

<!-- Footer Navigation Link -->

<span class="font-body-md text-body-md text-on-surface-variant">Already have an account?</span>
<a class="font-headline-sm text-headline-sm text-on-surface underline underline-offset-4 active:opacity-75 transition-opacity" href="#signin">
      Log in
    </a>
</div>
</div>
<script>
  (function() {
    // Password visibility toggle interaction
    const togglePassBtn = document.getElementById('togglePassword');
    const passInput = document.getElementById('passcode');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePassBtn && passInput && eyeIcon) {
      togglePassBtn.addEventListener('click', function() {
        const isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Biometric Toggle tactile behavior
    const bioSwitch = document.getElementById('biometricToggle');
    const knob = document.getElementById('toggleKnob');
    let isActive = true;

    if (bioSwitch && knob) {
      bioSwitch.addEventListener('click', function() {
        isActive = !isActive;
        bioSwitch.setAttribute('aria-checked', isActive ? 'true' : 'false');
        if (isActive) {
          bioSwitch.classList.replace('bg-surface-container-high', 'bg-primary');
          knob.classList.replace('left-0.5', 'left-6');
        } else {
          bioSwitch.classList.replace('bg-primary', 'bg-surface-container-high');
          knob.classList.replace('left-6', 'left-0.5');
        }
      });
    }
  })();
</script></main>
