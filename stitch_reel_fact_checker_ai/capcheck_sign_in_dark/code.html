<div class="flex flex-col gap-space-md p-5 rounded-2xl bg-[#181a20] border border-[#242731] shadow-[0_16px_36px_rgba(0,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,0.05)]">

<script>
  (function() {
    // Password visibility toggle
    const pwdInput = document.getElementById('password-field');
    const pwdToggleBtn = document.getElementById('toggle-password-btn');
    const pwdIcon = document.getElementById('pwd-icon');

    if (pwdToggleBtn && pwdInput && pwdIcon) {
      pwdToggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Biometric switch toggle interaction
    const bioToggle = document.getElementById('biometric-toggle');
    const toggleThumb = document.getElementById('toggle-thumb');

    if (bioToggle && toggleThumb) {
      bioToggle.addEventListener('click', function(e) {
        e.preventDefault();
        const isChecked = bioToggle.getAttribute('aria-checked') === 'true';
        if (isChecked) {
          bioToggle.setAttribute('aria-checked', 'false');
          bioToggle.classList.remove('bg-[#ffffff]');
          bioToggle.classList.add('bg-[#242832]');
          toggleThumb.classList.remove('translate-x-5');
          toggleThumb.classList.add('translate-x-0');
          toggleThumb.classList.remove('bg-[#0d0e11]');
          toggleThumb.classList.add('bg-[#848b98]');
        } else {
          bioToggle.setAttribute('aria-checked', 'true');
          bioToggle.classList.add('bg-[#ffffff]');
          bioToggle.classList.remove('bg-[#242832]');
          toggleThumb.classList.remove('translate-x-0');
          toggleThumb.classList.add('translate-x-5');
          toggleThumb.classList.add('bg-[#0d0e11]');
          toggleThumb.classList.remove('bg-[#848b98]');
        }
      });
    }
  })();
</script></main>
