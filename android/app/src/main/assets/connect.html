<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CatchLARP — Waking Server</title>
  <style>
    :root {
      --bg: #070709;
      --card: #0f1015;
      --border: rgba(255, 255, 255, 0.1);
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #22d3ee;
      --btn-bg: #ffffff;
      --btn-fg: #09090b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(600px 320px at 50% -80px, rgba(34, 211, 238, 0.14), transparent 70%),
        radial-gradient(480px 260px at 85% 15%, rgba(217, 70, 239, 0.1), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 18px 28px;
    }
    .shell { width: 100%; max-width: 420px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .badge {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #22d3ee, #d946ef);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #050507; flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(34, 211, 238, 0.25);
    }
    .eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent); margin: 0 0 2px;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .desc { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 0 0 14px; }
    .host-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #e4e4e7;
      background: #08080c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      word-break: break-all;
    }
    .banner {
      display: none;
      border-radius: 14px;
      padding: 11px 13px;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 14px;
      word-break: break-word;
    }
    .banner.show { display: block; }
    .banner.share {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #a7f3d0;
    }
    .banner.error {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fecdd3;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--btn-fg);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      min-height: 18px;
      word-break: break-word;
    }
    .status.ok { color: #6ee7b7; }
    .status.err { color: #fda4af; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="badge">CL</div>
      <div>
        <p class="eyebrow">CATCHLARP ANDROID</p>
        <h1>Reconnecting to Server</h1>
      </div>
    </div>

    <section class="card">
      <p class="desc">
        Render free-tier instances can take 20–30 seconds to wake after inactivity. Tap retry to open CatchLARP.
      </p>

      <div id="backend-host" class="host-pill">https://catchlarp.onrender.com</div>
      <div id="shared-banner" class="banner share"></div>
      <div id="error-banner" class="banner error"></div>

      <button id="retry-btn" type="button" class="btn">Retry Connection</button>
      <div id="status-msg" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (function () {
      const hostEl = document.getElementById("backend-host");
      const retryBtn = document.getElementById("retry-btn");
      const statusMsg = document.getElementById("status-msg");
      const sharedBanner = document.getElementById("shared-banner");
      const errorBanner = document.getElementById("error-banner");

      let backendUrl = "https://catchlarp.onrender.com";

      function setStatus(text, kind) {
        statusMsg.textContent = text || "";
        statusMsg.className = "status" + (kind ? " " + kind : "");
      }

      if (window.CatchLarpAndroid) {
        const configured = String(window.CatchLarpAndroid.getBackendUrl() || "").trim();
        if (configured) {
          backendUrl = configured;
          hostEl.textContent = backendUrl;
        }

        const shared = String(window.CatchLarpAndroid.peekPendingSharedUrl() || "").trim();
        if (shared) {
          sharedBanner.textContent = "Shared Instagram Reel queued: " + shared;
          sharedBanner.classList.add("show");
        }

        try {
          const errState = JSON.parse(window.CatchLarpAndroid.getPendingErrorStateJson() || "{}");
          if (errState.error) {
            errorBanner.textContent = errState.error;
            errorBanner.classList.add("show");
          }
        } catch (err) {
          // Ignore malformed error payload
        }
      }

      window.__catchLarpConnectResult = function (rawJson) {
        retryBtn.disabled = false;
        retryBtn.textContent = "Retry Connection";
        try {
          const data = JSON.parse(rawJson || "{}");
          if (data.ok) {
            setStatus("Connected (" + (data.daily_limit || 20) + " checks/day). Opening CatchLARP...", "ok");
          } else {
            setStatus(data.error || "Server is still waking up — try again in a moment.", "err");
          }
        } catch (err) {
          setStatus("Unexpected response while checking server.", "err");
        }
      };

      retryBtn.addEventListener("click", function () {
        errorBanner.classList.remove("show");
        retryBtn.disabled = true;
        retryBtn.textContent = "Waking Server...";
        setStatus("Checking " + backendUrl + "/api/auth/config...", "");
        if (window.CatchLarpAndroid) {
          window.CatchLarpAndroid.testAndConnect(backendUrl);
        } else {
          setStatus("Android bridge unavailable outside APK.", "err");
          retryBtn.disabled = false;
          retryBtn.textContent = "Retry Connection";
        }
      });
    })();
  </script>
</body>
</html>
